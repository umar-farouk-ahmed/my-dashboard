<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Organizer</title>
    
    <!-- Load Tailwind CSS for styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Load FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Load Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Custom scrollbar for a polished look */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        
        .line-clamp-2 {
            display: -webkit-box;
            -webkit-line-clamp: 2;
            -webkit-box-orient: vertical;  
            overflow: hidden;
        }

        /* Toast animations */
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; }
        }
        .toast-enter { animation: slideIn 0.3s ease-out forwards; }
        .toast-exit { animation: fadeOut 0.3s ease-out forwards; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col">

    <header class="bg-white border-b border-slate-200 shadow-sm sticky top-0 z-10">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 text-white p-2 rounded-lg">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight text-slate-900">Life Organizer</h1>
            </div>
            <div class="flex items-center gap-4 text-sm">
                <span id="connection-status" class="flex items-center gap-2 text-amber-500 font-medium">
                    <i class="fa-solid fa-circle-notch fa-spin"></i> Connecting...
                </span>
                <div class="hidden md:block bg-slate-100 px-3 py-1.5 rounded-full text-slate-500 font-mono text-xs overflow-hidden max-w-[200px] truncate" id="user-id-display">
                    Pending Authentication
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto w-full px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- Error State / Missing Config Warning -->
        <div id="config-warning" class="hidden mb-6 bg-red-50 border-l-4 border-red-500 p-4 rounded-r-md">
            <div class="flex">
                <div class="flex-shrink-0"><i class="fa-solid fa-triangle-exclamation text-red-500"></i></div>
                <div class="ml-3">
                    <h3 class="text-sm font-medium text-red-800">Configuration Missing</h3>
                    <div class="mt-2 text-sm text-red-700">
                        <p>Firebase configuration is missing. If you are hosting this on GitHub Pages, please edit the HTML file and provide your Firebase Config in the script section.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- COLUMN 1: What to do next (To-Dos) -->
            <section class="flex flex-col h-[80vh] lg:h-[calc(100vh-8rem)]">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-check-double text-emerald-500"></i> What to do next
                    </h2>
                    <span class="bg-emerald-100 text-emerald-700 text-xs font-bold px-2 py-1 rounded-full" id="todo-count">0</span>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden">
                    <form id="form-todo" class="p-4 border-b border-slate-100 flex gap-2 bg-slate-50">
                        <input type="text" id="input-todo" required placeholder="Add a new task..." class="flex-grow px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 transition-shadow">
                        <button type="submit" class="bg-emerald-500 hover:bg-emerald-600 text-white px-4 py-2 rounded-lg transition-colors text-sm font-medium whitespace-nowrap">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </form>
                    <div class="flex-grow overflow-y-auto p-2" id="list-todo">
                        <!-- Todo items will be injected here -->
                    </div>
                </div>
            </section>

            <!-- COLUMN 2: Long-term Plans -->
            <section class="flex flex-col h-[80vh] lg:h-[calc(100vh-8rem)]">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i class="fa-solid fa-map-location-dot text-indigo-500"></i> Long-Term Plans
                    </h2>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden">
                    <form id="form-plan" class="p-4 border-b border-slate-100 flex flex-col gap-2 bg-slate-50">
                        <input type="text" id="input-plan-title" required placeholder="Goal / Plan title" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-shadow">
                        <textarea id="input-plan-desc" rows="2" placeholder="Describe your plan..." class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 transition-shadow resize-none"></textarea>
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-lg transition-colors text-sm font-medium mt-1 w-full flex justify-center items-center gap-2">
                            <i class="fa-solid fa-paper-plane"></i> Save Plan
                        </button>
                    </form>
                    <div class="flex-grow overflow-y-auto p-4 space-y-3" id="list-plan">
                        <!-- Plan items will be injected here -->
                    </div>
                </div>
            </section>

            <!-- COLUMN 3: YouTube Links -->
            <section class="flex flex-col h-[80vh] lg:h-[calc(100vh-8rem)]">
                <div class="flex items-center justify-between mb-4">
                    <h2 class="text-lg font-semibold flex items-center gap-2">
                        <i class="fa-brands fa-youtube text-red-500"></i> Saved Videos
                    </h2>
                </div>
                
                <div class="bg-white rounded-xl shadow-sm border border-slate-200 flex-grow flex flex-col overflow-hidden">
                    <form id="form-youtube" class="p-4 border-b border-slate-100 flex flex-col gap-2 bg-slate-50">
                        <input type="url" id="input-youtube-url" required placeholder="https://youtube.com/watch?v=..." class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow">
                        <input type="text" id="input-youtube-title" placeholder="Custom Title (Optional)" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-red-500 transition-shadow">
                        <button type="submit" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg transition-colors text-sm font-medium mt-1 w-full flex justify-center items-center gap-2">
                            <i class="fa-solid fa-bookmark"></i> Save Video
                        </button>
                    </form>
                    <div class="flex-grow overflow-y-auto p-4 space-y-4" id="list-youtube">
                        <!-- YouTube items will be injected here -->
                    </div>
                </div>
            </section>

        </div>
    </main>

    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, deleteDoc, doc, updateDoc, onSnapshot, query } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // ==========================================
        // CONFIGURATION
        // ==========================================
        // If hosting on GitHub pages, replace the contents of this fallback object with your Firebase config.
        const fallbackConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        const firebaseConfig = typeof __firebase_config !== 'undefined' 
            ? JSON.parse(__firebase_config) 
            : fallbackConfig;
            
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'github-organizer';

        // Check if using placeholder config
        if(firebaseConfig.apiKey === "YOUR_API_KEY") {
            document.getElementById('config-warning').classList.remove('hidden');
        }

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        let currentUserId = null;

        // UI Elements
        const statusEl = document.getElementById('connection-status');
        const userIdEl = document.getElementById('user-id-display');
        
        // Data Arrays (for local sorting)
        let todos = [];
        let plans = [];
        let youtubeLinks = [];

        // ==========================================
        // HELPER FUNCTIONS
        // ==========================================
        
        function showToast(message, type = 'success') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            const bgColor = type === 'error' ? 'bg-red-600' : 'bg-slate-800';
            const icon = type === 'error' ? 'fa-triangle-exclamation' : 'fa-check-circle';
            
            toast.className = `${bgColor} text-white px-4 py-3 rounded-lg shadow-lg flex items-center gap-3 toast-enter pointer-events-auto`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> <span class="text-sm font-medium">${message}</span>`;
            
            container.appendChild(toast);
            
            setTimeout(() => {
                toast.classList.replace('toast-enter', 'toast-exit');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function extractYouTubeID(url) {
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        }

        function formatDate(timestamp) {
            if (!timestamp) return '';
            const date = new Date(timestamp);
            return date.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
        }

        // ==========================================
        // AUTHENTICATION
        // ==========================================
        
        async function initializeAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
                
                currentUserId = auth.currentUser.uid;
                
                // Update UI
                statusEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> Connected`;
                statusEl.className = "flex items-center gap-2 text-emerald-500 font-medium";
                userIdEl.textContent = `User: ${currentUserId}`;
                
                // Start loading data
                setupRealtimeListeners();
                
            } catch (error) {
                console.error("Auth Error:", error);
                statusEl.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> Auth Failed`;
                statusEl.className = "flex items-center gap-2 text-red-500 font-medium";
                showToast("Authentication failed", "error");
            }
        }

        // ==========================================
        // DATA FETCHING & LISTENING
        // ==========================================
        
        function setupRealtimeListeners() {
            if (!currentUserId) return;

            const userPath = `artifacts/${appId}/users/${currentUserId}`;

            // Listen to Todos
            onSnapshot(query(collection(db, `${userPath}/todos`)), (snapshot) => {
                todos = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                // Sort locally by creation date descending
                todos.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderTodos();
            }, (error) => {
                console.error("Error fetching todos:", error);
                showToast("Failed to sync tasks", "error");
            });

            // Listen to Plans
            onSnapshot(query(collection(db, `${userPath}/plans`)), (snapshot) => {
                plans = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                plans.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderPlans();
            }, (error) => {
                console.error("Error fetching plans:", error);
            });

            // Listen to YouTube Links
            onSnapshot(query(collection(db, `${userPath}/youtubeLinks`)), (snapshot) => {
                youtubeLinks = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() }));
                youtubeLinks.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
                renderYouTubeLinks();
            }, (error) => {
                console.error("Error fetching YouTube links:", error);
            });
        }

        // ==========================================
        // RENDERING FUNCTIONS
        // ==========================================
        
        function renderTodos() {
            const listEl = document.getElementById('list-todo');
            const countEl = document.getElementById('todo-count');
            listEl.innerHTML = '';
            
            const activeCount = todos.filter(t => !t.completed).length;
            countEl.textContent = activeCount;

            if (todos.length === 0) {
                listEl.innerHTML = `<div class="text-center p-6 text-slate-400 text-sm">No tasks yet. Add one above!</div>`;
                return;
            }

            todos.forEach(todo => {
                const el = document.createElement('div');
                el.className = `group flex items-center justify-between p-3 mb-2 rounded-lg border transition-all ${todo.completed ? 'bg-slate-50 border-slate-100 opacity-70' : 'bg-white border-slate-200 hover:border-emerald-300 hover:shadow-sm'}`;
                
                el.innerHTML = `
                    <div class="flex items-center gap-3 overflow-hidden">
                        <button class="toggle-btn flex-shrink-0 text-xl transition-colors ${todo.completed ? 'text-emerald-500' : 'text-slate-300 hover:text-emerald-400'}" data-id="${todo.id}" data-state="${todo.completed}">
                            <i class="${todo.completed ? 'fa-solid fa-circle-check' : 'fa-regular fa-circle'}"></i>
                        </button>
                        <span class="text-sm truncate ${todo.completed ? 'line-through text-slate-400' : 'text-slate-700 font-medium'}">${todo.task}</span>
                    </div>
                    <button class="delete-todo-btn text-slate-300 hover:text-red-500 transition-colors px-2 opacity-0 group-hover:opacity-100" data-id="${todo.id}">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                `;
                listEl.appendChild(el);
            });
            
            attachTodoListeners();
        }

        function renderPlans() {
            const listEl = document.getElementById('list-plan');
            listEl.innerHTML = '';

            if (plans.length === 0) {
                listEl.innerHTML = `<div class="text-center p-6 text-slate-400 text-sm">No long-term plans set. Dream big!</div>`;
                return;
            }

            plans.forEach(plan => {
                const el = document.createElement('div');
                el.className = `group bg-white border border-slate-200 rounded-xl p-4 hover:shadow-md transition-all relative overflow-hidden`;
                el.innerHTML = `
                    <div class="absolute top-0 left-0 w-1 h-full bg-indigo-500"></div>
                    <div class="flex justify-between items-start mb-2 pl-2">
                        <h3 class="font-semibold text-slate-800 leading-tight">${plan.title}</h3>
                        <button class="delete-plan-btn text-slate-300 hover:text-red-500 transition-colors ml-2" data-id="${plan.id}">
                            <i class="fa-solid fa-xmark text-lg"></i>
                        </button>
                    </div>
                    <p class="text-sm text-slate-600 pl-2 whitespace-pre-line mb-3">${plan.description}</p>
                    <div class="pl-2 text-xs text-slate-400 font-mono"><i class="fa-regular fa-calendar mr-1"></i> ${formatDate(plan.createdAt)}</div>
                `;
                listEl.appendChild(el);
            });
            
            attachPlanListeners();
        }

        function renderYouTubeLinks() {
            const listEl = document.getElementById('list-youtube');
            listEl.innerHTML = '';

            if (youtubeLinks.length === 0) {
                listEl.innerHTML = `<div class="text-center p-6 text-slate-400 text-sm">No saved videos. Save tutorials or inspiration!</div>`;
                return;
            }

            youtubeLinks.forEach(item => {
                const videoId = extractYouTubeID(item.url);
                const thumbnailUrl = videoId ? `https://img.youtube.com/vi/${videoId}/mqdefault.jpg` : 'https://placehold.co/320x180/1e293b/ffffff?text=Video+Link';
                
                const el = document.createElement('div');
                el.className = `group flex flex-col bg-white border border-slate-200 rounded-xl overflow-hidden hover:shadow-md transition-shadow`;
                
                el.innerHTML = `
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" class="relative w-full pb-[56.25%] bg-slate-900 block overflow-hidden">
                        <img src="${thumbnailUrl}" alt="Thumbnail" class="absolute top-0 left-0 w-full h-full object-cover opacity-90 group-hover:opacity-100 transition-opacity" onerror="this.src='https://placehold.co/320x180/1e293b/ffffff?text=Link'">
                        <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/30 transition-all">
                            <i class="fa-brands fa-youtube text-4xl text-red-500 drop-shadow-md"></i>
                        </div>
                    </a>
                    <div class="p-3 flex justify-between items-start gap-2">
                        <div class="overflow-hidden">
                            <h4 class="text-sm font-semibold text-slate-800 line-clamp-2" title="${item.title || item.url}">${item.title || 'Saved Video'}</h4>
                            <p class="text-xs text-slate-500 truncate mt-1">${item.url}</p>
                        </div>
                        <button class="delete-yt-btn text-slate-400 hover:text-red-500 transition-colors p-1" data-id="${item.id}">
                            <i class="fa-solid fa-trash-can"></i>
                        </button>
                    </div>
                `;
                listEl.appendChild(el);
            });
            
            attachYouTubeListeners();
        }

        // ==========================================
        // EVENT LISTENERS & CRUD OPERATIONS
        // ==========================================

        // Todo Actions
        document.getElementById('form-todo').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUserId) return;
            const input = document.getElementById('input-todo');
            const val = input.value.trim();
            if(!val) return;
            
            input.disabled = true;
            try {
                const userPath = `artifacts/${appId}/users/${currentUserId}`;
                await addDoc(collection(db, `${userPath}/todos`), {
                    task: val,
                    completed: false,
                    createdAt: Date.now()
                });
                input.value = '';
                showToast("Task added");
            } catch (err) {
                console.error(err);
                showToast("Failed to add task", "error");
            } finally {
                input.disabled = false;
                input.focus();
            }
        });

        function attachTodoListeners() {
            document.querySelectorAll('.toggle-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    const currentState = e.currentTarget.getAttribute('data-state') === 'true';
                    try {
                        const docRef = doc(db, `artifacts/${appId}/users/${currentUserId}/todos`, id);
                        await updateDoc(docRef, { completed: !currentState });
                    } catch(err) {
                        console.error(err);
                    }
                });
            });

            document.querySelectorAll('.delete-todo-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    try {
                        await deleteDoc(doc(db, `artifacts/${appId}/users/${currentUserId}/todos`, id));
                        showToast("Task removed");
                    } catch(err) {
                        console.error(err);
                    }
                });
            });
        }

        // Plan Actions
        document.getElementById('form-plan').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUserId) return;
            const titleInp = document.getElementById('input-plan-title');
            const descInp = document.getElementById('input-plan-desc');
            const btn = e.target.querySelector('button');
            
            const title = titleInp.value.trim();
            const desc = descInp.value.trim();
            if(!title) return;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            
            try {
                const userPath = `artifacts/${appId}/users/${currentUserId}`;
                await addDoc(collection(db, `${userPath}/plans`), {
                    title: title,
                    description: desc,
                    createdAt: Date.now()
                });
                titleInp.value = '';
                descInp.value = '';
                showToast("Plan saved successfully");
            } catch (err) {
                console.error(err);
                showToast("Failed to save plan", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Save Plan';
            }
        });

        function attachPlanListeners() {
            document.querySelectorAll('.delete-plan-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    try {
                        await deleteDoc(doc(db, `artifacts/${appId}/users/${currentUserId}/plans`, id));
                        showToast("Plan removed");
                    } catch(err) {
                        console.error(err);
                    }
                });
            });
        }

        // YouTube Actions
        document.getElementById('form-youtube').addEventListener('submit', async (e) => {
            e.preventDefault();
            if(!currentUserId) return;
            const urlInp = document.getElementById('input-youtube-url');
            const titleInp = document.getElementById('input-youtube-title');
            const btn = e.target.querySelector('button');
            
            const url = urlInp.value.trim();
            const title = titleInp.value.trim();
            if(!url) return;
            
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
            
            try {
                const userPath = `artifacts/${appId}/users/${currentUserId}`;
                await addDoc(collection(db, `${userPath}/youtubeLinks`), {
                    url: url,
                    title: title,
                    createdAt: Date.now()
                });
                urlInp.value = '';
                titleInp.value = '';
                showToast("Video link saved");
            } catch (err) {
                console.error(err);
                showToast("Failed to save link", "error");
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-bookmark"></i> Save Video';
            }
        });

        function attachYouTubeListeners() {
            document.querySelectorAll('.delete-yt-btn').forEach(btn => {
                btn.addEventListener('click', async (e) => {
                    const id = e.currentTarget.getAttribute('data-id');
                    try {
                        await deleteDoc(doc(db, `artifacts/${appId}/users/${currentUserId}/youtubeLinks`, id));
                        showToast("Video removed");
                    } catch(err) {
                        console.error(err);
                    }
                });
            });
        }

        // ==========================================
        // BOOTSTRAP
        // ==========================================
        // Start the application
        initializeAuth();

    </script>
</body>
</html>
